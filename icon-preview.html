<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>iOS 图标预览 · SF Symbols 风格</title>
<style>
  :root {
    --bg: #F2F2F7;
    --card: rgba(255,255,255,0.78);
    --text: #1C1C1E;
    --sub: #8E8E93;
    --blue: #007AFF;
    --green: #34C759;
    --orange: #FF9500;
    --red: #FF3B30;
    --purple: #AF52DE;
    --sep: rgba(60,60,67,0.18);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 40px 24px 80px;
    background: linear-gradient(180deg, #E8F1FF 0%, #F2F2F7 40%, #FFF5F8 100%);
    background-attachment: fixed;
    font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', sans-serif;
    color: var(--text);
  }
  h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.4px; margin: 0 0 6px; }
  .lead { color: var(--sub); font-size: 14px; margin: 0 0 28px; max-width: 720px; line-height: 1.6; }
  .group { margin: 0 0 28px; }
  .group h2 { font-size: 13px; font-weight: 600; color: var(--sub); text-transform: uppercase; letter-spacing: 0.6px; margin: 0 0 12px 4px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
  .card {
    background: var(--card); backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.5); border-radius: 18px;
    padding: 14px 16px; box-shadow: 0 4px 16px rgba(0,0,0,0.05);
  }
  .name { font-size: 13px; font-weight: 600; margin-bottom: 10px; font-family: ui-monospace, 'SF Mono', Menlo, monospace; }
  .row { display: flex; align-items: center; gap: 14px; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .cell .lbl { font-size: 10px; color: var(--sub); }
  .tile {
    width: 44px; height: 44px; border-radius: 11px;
    display: flex; align-items: center; justify-content: center;
  }
  .tile.neutral { background: rgba(120,120,128,0.10); }
  .tile.blue { background: rgba(0,122,255,0.12); }
  .tile.orange { background: rgba(255,149,0,0.12); }
  .tile.green { background: rgba(52,199,89,0.12); }
  .tile.purple { background: rgba(175,82,222,0.12); }
  .swatches { display: flex; gap: 8px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--sep); }
  .swatches img { width: 22px; height: 22px; }
  .na { color: var(--sub); font-size: 11px; height: 44px; display: flex; align-items: center; }
  code { background: rgba(120,120,128,0.12); padding: 1px 5px; border-radius: 4px; font-size: 12px; }
</style>
</head>
<body>
<h1>iOS 图标预览</h1>
<p class="lead">
  本页镜像 <code>components/icon/icon.js</code> 的 ICONS 数据，用于肉眼 QA。
  每个图标展示 <b>outline</b>（默认）与 <b>fill</b>（选中态/磁贴）两种模式，外加几种 iOS 系统色描边。
  fill 缺省的纯字形图标以「—」表示。在浏览器中查看几何是否贴合 SF Symbols。
</p>
<div id="app"></div>

  'checkmark-circle': { o:'<circle cx="12" cy="12" r="9"/><path d="M8.5 12.2l2.4 2.4 4.6-5.2"/>', f:'<circle fill="__C__" cx="12" cy="12" r="10.5"/><path d="M8 12.2l2.6 2.6 5-5.6" stroke="#FFFFFF" stroke-width="2.4" fill="none"/>' },

  mappin: { o:'<path d="M12 21s7-5.5 7-11a7 7 0 1 0-14 0c0 5.5 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/>', f:'<path fill="__C__" fill-rule="evenodd" d="M12 21s7-5.5 7-11a7 7 0 1 0-14 0c0 5.5 7 11 7 11zM12 12.5a2.5 2.5 0 1 0 0-5 2.5 2.5 0 0 0 0 5z"/>' },

  'doc-text': { o:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h6M9 9.5h3"/>', f:'<path fill="__C__" fill-rule="evenodd" d="M7 3h7l5 5v11a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zM9 12.5h6v1.6H9zM9 16h6v1.6H9zM9 9h3v1.6H9z"/>' },
  'doc-on-doc': { o:'<path d="M9 7V6a2 2 0 0 1 2-2h5l4 4v8a2 2 0 0 1-2 2h-1" stroke-opacity="0.5"/><rect x="3.5" y="7" width="12" height="13" rx="2"/><path d="M10 12h4M10 15.5h4" stroke-opacity="0.55"/>', f:'<path fill="__C__" fill-opacity="0.5" d="M9 7V6a2 2 0 0 1 2-2h5l4 4v8a2 2 0 0 1-2 2h-2V9l-5-5h-2v3z"/><rect fill="__C__" x="3.5" y="7" width="12" height="13" rx="2"/><path fill="#FFFFFF" fill-opacity="0.45" d="M10 11.8h4v1.4h-4zM10 14.8h4v1.4h-4z"/>' },
  'building-columns': { o:'<path d="M3 9.5L12 4l9 5.5"/><path d="M4 9.5h16"/><path d="M5.5 9.5v9M9.5 9.5v9M14.5 9.5v9M18.5 9.5v9" stroke-opacity="0.6"/><path d="M3.5 19.5h17"/><path d="M3 21.5h18"/>', f:'<path fill="__C__" d="M3 9.5L12 4l9 5.5z"/><rect fill="__C__" x="3.2" y="9" width="17.6" height="1.4"/><path fill="__C__" fill-opacity="0.55" d="M5.2 10.4h1.6v8.4h-1.6zM9.2 10.4h1.6v8.4h-1.6zM13.2 10.4h1.6v8.4h-1.6zM17.2 10.4h1.6v8.4h-1.6z"/><rect fill="__C__" x="3" y="18.8" width="18" height="1.4"/><rect fill="__C__" x="2.4" y="20.8" width="19.2" height="1.4"/>' },
  'house-door': { o:'<path d="M3.5 11.5L12 4l8.5 7.5"/><path d="M6 10v10h12V10"/><path d="M10 20v-5h4v5"/>', f:'<path fill="__C__" fill-rule="evenodd" d="M12 3.2L20.8 11.4H18.8V20H14.4V15H9.6V20H5.2V11.4H3.2zM10.2 15h3.6v5h-3.6z"/>' },

  banknote: { o:'<rect x="2.5" y="6.5" width="19" height="11" rx="2"/><circle cx="8" cy="12" r="2.2" stroke-opacity="0.6"/><circle cx="16" cy="12" r="2.2" stroke-opacity="0.6"/>' },

};

const GROUPS = [
  { title: '导航 / 品牌', names: ['house','doc-plaintext','person'] },
  { title: '服务类型', names: ['shippingbox','printer','takeoutbag','fork-knife','bicycle'] },
  { title: '状态 / 徽标', names: ['clock','checkmark-circle','checkmark-seal','xmark-circle','exclamationmark-circle'] },
  { title: '联系 / 设置', names: ['phone','bubble','gear','arrow-right-from-bracket','mappin','wallet'] },
  { title: '文档', names: ['doc-text','doc-on-doc'] },
  { title: '地址 / 建筑', names: ['building-columns','house-door','cube','banknote'] },
  { title: '纯字形 / 杂项', names: ['plus','checkmark','xmark','chevron-right','minus','trash','pencil','location','magnifyingglass','bell'] }
];

const COLORS = [['#007AFF','blue'],['#34C759','green'],['#FF9500','orange'],['#FF3B30','red'],['#AF52DE','purple']];

function resolveWeight(weight, size){
  if(weight===0||weight==='0'||weight==null||weight===''){ const s=parseFloat(size); if(isNaN(s)||s<=30)return 2.0; if(s<=50)return 1.85; return 1.7; }
  return Number(weight)||2;
}
function buildSrc(name,color,weight,fill,size){
  const entry=ICONS[name]; if(!entry)return '';
  const useFill=!!fill&&!!entry.f;
  const inner=useFill?entry.f.replace(/__C__/g,color):entry.o;
  const caps=' stroke-linecap="round" stroke-linejoin="round"';
  const common='xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 24 24"';
  let svg;
  if(useFill){ svg='<svg '+common+' fill="none" stroke="none"'+caps+'>'+inner+'</svg>'; }
  else { const w=resolveWeight(weight,size); svg='<svg '+common+' fill="none" stroke="'+color+'" stroke-width="'+w+'"'+caps+'>'+inner+'</svg>'; }
  return 'data:image/svg+xml;base64,'+btoa(svg);
}

function tile(name, fill, tileClass){
  const src = buildSrc(name, '#007AFF', 0, fill, 44);
  return '<div class="tile '+tileClass+'"><img src="'+src+'" style="width:28px;height:28px" /></div>';
}
function card(name){
  const hasF = !!ICONS[name].f;
  const outSrc = buildSrc(name,'#007AFF',0,false,44);
  const fillSrc = hasF ? buildSrc(name,'#007AFF',0,true,44) : '';
  let swatches = COLORS.map(function(c){
    return '<img src="'+buildSrc(name,c[0],0,false,22)+'" style="width:22px;height:22px" />';
  }).join('');
  return '<div class="card">'
    + '<div class="name">'+name+'</div>'
    + '<div class="row">'
      + '<div class="cell"><div class="tile neutral"><img src="'+outSrc+'" style="width:28px;height:28px" /></div><span class="lbl">outline</span></div>'
      + (hasF
          ? '<div class="cell"><div class="tile blue"><img src="'+fillSrc+'" style="width:28px;height:28px" /></div><span class="lbl">fill</span></div>'
          : '<div class="cell"><div class="na">—</div><span class="lbl">fill</span></div>')
    + '</div>'
    + '<div class="swatches">'+swatches+'</div>'
    + '</div>';
}

const app = document.getElementById('app');
let html = '';
GROUPS.forEach(function(g){
  html += '<div class="group"><h2>'+g.title+'</h2><div class="grid">';
  g.names.forEach(function(n){ html += card(n); });
  html += '</div></div>';
});
app.innerHTML = html;
</script>
</body>
</html>
